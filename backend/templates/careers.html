<!DOCTYPE html>
<html>
<head>
    <title>Select Career</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1{
            text-align: center;
        }

        h3{
            text-align: center;
        }

        .career-list{
    width: 500px;
    margin-top: 30px;
    margin-left: 50px;
}

        .career-item{
    
            padding: 15px;
            margin-bottom: 10px;
        }

        button{
            margin-top: 10px;
            padding: 5px 10px;
            cursor: pointer;
        }

    </style>
</head>

<body>

    <h1>Select Your Career</h1>

    <h3>Available Career Paths</h3>

    <div class="career-list">

        <div class="career-item">
            <strong>Software Engineer</strong><br>
            Learn programming and software development.<br>

            <a href="/software_engineer">
                <button>Select Path</button>
            </a>
        </div>

        <div class="career-item">
            <strong>Data Scientist</strong><br>
            Learn Python, AI and machine learning.<br>

            <a href="/data_scientist">
                <button>Select Path</button>
            </a>
        </div>

        <div class="career-item">
            <strong>Data Analyst</strong><br>
            Learn SQL, Excel and Power BI.<br>

            <a href="/data_analyst">
                <button>Select Path</button>
            </a>
        </div>

        <div class="career-item">
            <strong>Cybersecurity Analyst</strong><br>
            Learn networking and cyber defense.<br>

            <a href="/cybersecurity_analyst">
                <button>Select Path</button>
            </a>
        </div>

    </div>

</body>
</html>
